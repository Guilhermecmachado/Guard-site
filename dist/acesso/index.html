<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Área do Associado | Guard</title><meta name="description" content="Acesso reservado do associado Guard.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%2310c76f' d='M32 4 54 12v17c0 15-9 25-22 31C19 54 10 44 10 29V12z'/%3E%3Cpath fill='none' stroke='%230b2740' stroke-width='6' stroke-linecap='round' stroke-linejoin='round' d='m21 31 8 8 15-17'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="login-page">
  <a class="login-brand" href="/" aria-label="Voltar ao início"><img src="/assets/original/logo-grupo-guard-brasil.png" alt="Grupo Guard Brasil"></a>
  <main class="login-shell">
    <section class="login-intro"><span class="eyebrow light">ÁREA DO ASSOCIADO</span><h1>Bem-vindo de volta.</h1><p>Acesse seu ambiente reservado para acompanhar informações da sua associação.</p><a href="/">← Voltar ao site institucional</a></section>
    <section class="login-card" aria-labelledby="login-title"><span class="login-lock">✓</span><h2 id="login-title">Acesse sua conta</h2><p>Informe seus dados de acesso.</p>
      <form id="login-form"><label for="documento">CPF ou CNPJ</label><input id="documento" name="documento" autocomplete="username" inputmode="numeric" placeholder="Digite apenas números" required>
      <label for="senha">Senha</label><div class="password-field"><input id="senha" name="senha" type="password" autocomplete="current-password" placeholder="Sua senha" required><button type="button" id="toggle-password" aria-label="Mostrar senha">Mostrar</button></div>
      <div class="form-row"><label class="checkbox"><input type="checkbox"> Lembrar de mim</label><a href="#" id="forgot-link">Esqueci minha senha</a></div>
      <button class="button login-submit" type="submit">Entrar</button><div class="form-message" role="status" aria-live="polite"></div></form>
    </section>
  </main>
  <script src="/script.js"></script>
</body>
</html>
