<a class="login-brand" routerLink="/" aria-label="Voltar ao início">
  <img src="/assets/original/logo-grupo-guard-brasil.png" alt="Grupo Guard Brasil">
</a>
<main class="login-shell">
  <section class="login-intro">
    <span class="eyebrow light">ÁREA DO ASSOCIADO</span>
    <h1>Bem-vindo de volta.</h1>
    <p>Acesse seu ambiente reservado para acompanhar informações da sua associação.</p>
    <a routerLink="/">← Voltar ao site institucional</a>
  </section>
  <section class="login-card" aria-labelledby="login-title">
    <span class="login-lock">✓</span>
    <h2 id="login-title">Acesse sua conta</h2>
    <p>Informe seus dados de acesso.</p>
    <form (ngSubmit)="onSubmit()">
      <label for="documento">CPF ou CNPJ</label>
      <input id="documento" name="documento" autocomplete="username" inputmode="numeric" placeholder="Digite apenas números" required>
      <label for="senha">Senha</label>
      <div class="password-field">
        <input id="senha" name="senha" [type]="showPassword ? 'text' : 'password'" autocomplete="current-password" placeholder="Sua senha" required>
        <button type="button" [attr.aria-label]="showPassword ? 'Ocultar senha' : 'Mostrar senha'" (click)="togglePassword()">{{ showPassword ? 'Ocultar' : 'Mostrar' }}</button>
      </div>
      <div class="form-row">
        <label class="checkbox"><input type="checkbox"> Lembrar de mim</label>
        <a href="#" id="forgot-link" (click)="onForgot($event)">Esqueci minha senha</a>
      </div>
      <button class="button login-submit" type="submit">Entrar</button>
      <div class="form-message" role="status" aria-live="polite">{{ message }}</div>
    </form>
  </section>
</main>
